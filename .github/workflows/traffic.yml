name: Save GitHub Traffic

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  traffic:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fetch traffic
        env:
          TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          mkdir -p analytics

          DATE=$(date +%F)

          VIEWS=$(curl -s \
            -H "Authorization: token $TOKEN" \
            https://api.github.com/repos/stephkillingsworth/CoC_Chapter4/traffic/views)

          CLONES=$(curl -s \
            -H "Authorization: token $TOKEN" \
            https://api.github.com/repos/stephkillingsworth/CoC_Chapter4/traffic/clones)

          VIEW_COUNT=$(echo "$VIEWS" | jq '.count')
          UNIQUE_VISITORS=$(echo "$VIEWS" | jq '.uniques')

          CLONE_COUNT=$(echo "$CLONES" | jq '.count')
          UNIQUE_CLONERS=$(echo "$CLONES" | jq '.uniques')
          REPO=$(curl -s \
            -H "Authorization: token $TOKEN" \
            https://api.github.com/repos/stephkillingsworth/CoC_Chapter4)

          STARS=$(echo "$REPO" | jq '.stargazers_count')
          FORKS=$(echo "$REPO" | jq '.forks_count')
          WATCHERS=$(echo "$REPO" | jq '.subscribers_count')
          ISSUES=$(echo "$REPO" | jq '.open_issues_count')
          if [ ! -f analytics/traffic.csv ]; then
          echo "date,total_repository_page_views,unique_visitors,total_clone_events,unique_cloners,stars,forks,watchers,open_issues" > 
          analytics/traffic.csv

          if ! grep -q "^$DATE," analytics/traffic.csv; then
          echo "$DATE,$VIEW_COUNT,$UNIQUE_VISITORS,$CLONE_COUNT,$UNIQUE_CLONERS,$STARS,$FORKS,$WATCHERS,$ISSUES" >> 
          analytics/traffic.csv            

      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add analytics/traffic.csv

          git diff --staged --quiet || git commit -m "Update traffic metrics"

          git push
